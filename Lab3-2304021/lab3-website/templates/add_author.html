
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Author</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f9;
            color: #243b55;
        }

        form {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 20px;
            padding: 11px 20px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .error {
            color: #c62828;
        }
    </style>
</head>

<body>
    <h1>Add a New Author</h1>

    {% for error in errors %}
        <p class="error">{{ error }}</p>
    {% endfor %}

    <form method="POST" action="{{ url_for('add_author') }}" enctype="multipart/form-data">
        <label for="author_id">Author ID</label>
        <input
            type="number"
            id="author_id"
            name="author_id"
            min="1"
            required
        >

        <label for="name">Author Name</label>
        <input
            type="text"
            id="name"
            name="name"
            maxlength="100"
            required
        >

        <label for="country">Country</label>
        <input
            type="text"
            id="country"
            name="country"
            maxlength="50"
            required
        >
<label for="author_photo">Author Photo</label>
<input
    type="file"
    id="author_photo"
    name="author_photo"
    accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
>
        <button type="submit">Add Author</button>
    </form>

    <p>
        <a href="{{ url_for('library') }}">Back to Library</a>
    </p>
</body>
</html>
