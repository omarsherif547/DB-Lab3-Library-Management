
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Author</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f9;
            color: #243b55;
        }

        form {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            margin-top: 20px;
            padding: 11px 20px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .error {
            color: #c62828;
        }
    </style>
</head>

<body>
    <h1>Edit Author</h1>

    {% for error in errors %}
        <p class="error">{{ error }}</p>
    {% endfor %}

    <form method="POST"
          action="{{ url_for('edit_author', author_id=author.author_id) }}" enctype="multipart/form-data">

        <p><strong>Author ID:</strong> {{ author.author_id }}</p>

        <label for="name">Author Name</label>
        <input
            type="text"
            id="name"
            name="name"
            maxlength="100"
            value="{{ author.name }}"
            required
        >

        <label for="country">Country</label>
        <input
            type="text"
            id="country"
            name="country"
            maxlength="50"
            value="{{ author.country or '' }}"
        >

<label for="author_photo">Author Profile Photo</label>

{% if author.photo_filename %}
    <p>Current photo:</p>
    <img
        src="{{ url_for('static', filename='uploads/' ~ author.photo_filename) }}"
        alt="Current author photo"
        style="width: 100px; height: 100px; object-fit: cover; border-radius: 50%;"
    >
{% endif %}

<input
    type="file"
    id="author_photo"
    name="author_photo"
    accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
>
<p>Choose a new image to replace the current photo. Leave empty to keep it.</p>

        <button type="submit">Save Changes</button>
    </form>

    <p><a href="{{ url_for('library') }}">Back to Library</a></p>
</body>
</html>
